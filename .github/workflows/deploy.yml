name: deploy
on:
  workflow_dispatch:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
permissions:
  id-token: write
  contents: read
jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    env:
      REGION: ${{ vars.AWS_REGION || secrets.AWS_REGION }}
      ACCOUNT: ${{ vars.AWS_ACCOUNT_ID || secrets.AWS_ACCOUNT_ID }}
      FUNC: security-rag
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Show OIDC subject (not secret; helps debug trust policy)
        run: |
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          echo "$TOKEN" | cut -d. -f2 | tr '_-' '/+' | base64 -d 2>/dev/null | jq '{sub, aud, ref, repository}'
          echo "account id length: ${#ACCOUNT}"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID || secrets.AWS_ACCOUNT_ID }}:role/security-rag-deploy
          aws-region: ${{ vars.AWS_REGION || secrets.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        run: |
          IMAGE="$ACCOUNT.dkr.ecr.$REGION.amazonaws.com/security-rag:${{ github.sha }}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Create or update the function
        env:
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          # Poll with get-function (lambda:GetFunction) instead of the CLI waiters, which need
          # lambda:GetFunctionConfiguration that the deploy role does not have.
          wait_ready() {
            for i in $(seq 1 60); do
              read -r STATE UPDATE <<<"$(aws lambda get-function --function-name "$FUNC" --region "$REGION"                 --query 'Configuration.[State,LastUpdateStatus]' --output text)"
              if [ "$STATE" = "Active" ] && [ "$UPDATE" = "Successful" ]; then return 0; fi
              if [ "$STATE" = "Failed" ] || [ "$UPDATE" = "Failed" ]; then echo "function state $STATE / $UPDATE"; return 1; fi
              sleep 5
            done
            echo "timed out waiting for the function to become ready"; return 1
          }
          if aws lambda get-function --function-name "$FUNC" --region "$REGION" >/dev/null 2>&1; then
            echo "function exists, updating configuration and code"
            wait_ready
            # Re-apply the environment on every run so a corrected GitHub secret propagates.
            ENV_JSON=$(jq -n               --arg cohere "$COHERE_API_KEY"               --arg anthropic "$ANTHROPIC_API_KEY"               --arg db "$DATABASE_URL"               '{Variables:{COHERE_API_KEY:$cohere,ANTHROPIC_API_KEY:$anthropic,DATABASE_URL:$db}}')
            for name in COHERE_API_KEY ANTHROPIC_API_KEY DATABASE_URL; do
              if [ -z "${!name}" ]; then echo "GitHub secret $name is empty or missing; set it under Settings, Secrets and variables, Actions"; exit 1; fi
            done
            aws lambda update-function-configuration --function-name "$FUNC" --environment "$ENV_JSON" --region "$REGION" >/dev/null
            wait_ready
            aws lambda update-function-code --function-name "$FUNC" --image-uri "$IMAGE" --region "$REGION" >/dev/null
            wait_ready
          else
            echo "function does not exist yet, creating it"
            for name in COHERE_API_KEY ANTHROPIC_API_KEY DATABASE_URL; do
              if [ -z "${!name}" ]; then echo "GitHub secret $name is empty or missing; set it under Settings, Secrets and variables, Actions"; exit 1; fi
            done
            # Built with jq so any character in a secret (commas, braces,
            # quotes) is escaped correctly. Never printed: GitHub also
            # masks these values in the log if they show up anyway.
            ENV_JSON=$(jq -n               --arg cohere "$COHERE_API_KEY"               --arg anthropic "$ANTHROPIC_API_KEY"               --arg db "$DATABASE_URL"               '{Variables:{COHERE_API_KEY:$cohere,ANTHROPIC_API_KEY:$anthropic,DATABASE_URL:$db}}')
            aws lambda create-function               --function-name "$FUNC"               --package-type Image               --code ImageUri="$IMAGE"               --role "${{ vars.LAMBDA_EXEC_ROLE_ARN || secrets.LAMBDA_EXEC_ROLE_ARN }}"               --timeout 60               --memory-size 1024               --environment "$ENV_JSON"               --region "$REGION" >/dev/null
            wait_ready
          fi

          # Public URL and invoke permission, idempotent: both calls fail harmlessly when already present.
          if ! aws lambda get-function-url-config --function-name "$FUNC" --region "$REGION" >/dev/null 2>&1; then
            echo "creating the public function url"
            aws lambda create-function-url-config --function-name "$FUNC" --auth-type NONE --region "$REGION" >/dev/null
          fi
          aws lambda add-permission             --function-name "$FUNC"             --statement-id url-public             --action lambda:InvokeFunctionUrl             --principal "*"             --function-url-auth-type NONE             --region "$REGION" >/dev/null 2>&1 || echo "invoke permission already present"

      - name: Health check
        run: |
          URL=$(aws lambda get-function-url-config --function-name "$FUNC" --region "$REGION" --query FunctionUrl --output text)
          echo "FUNCTION_URL=$URL" >> "$GITHUB_ENV"
          BODY=$(curl -fsS "${URL}health")
          echo "$BODY" | grep -q '"ok":true'

      - name: Job summary
        run: |
          {
            echo "## Deployed"
            echo ""
            echo "Function URL: ${FUNCTION_URL}"
          } >> "$GITHUB_STEP_SUMMARY"
